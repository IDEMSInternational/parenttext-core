
name: Pull Data

on:
  workflow_call:
    secrets:
      GCP_CREDENTIALS:
        description: 'Service account credentials for Google Cloud Platform.'
        required: true
      # A Personal Access Token is required for the `create-pull-request` action.
      PAT:
        description: 'A GitHub Personal Access Token with repo and workflow scopes.'
        required: true

jobs:
  pull:
    name: Pull
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install Node dependencies
        run: npm ci
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Pull Data
        env:
          CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python -m parenttext_pipeline.cli pull_data
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PAT }}
          commit-message: "Automated update from script"
          title: "Automated pull data"
          body: "This PR contains changes generated by `pull_data` run by GitHub Actions. If the automated compile completes, it should be safe to merge."
          branch: automated-pull
